name: Generate contribution snake
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]
permissions:
  contents: write
concurrency:
  group: contribution-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Generate pastel green snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HeitorLeite
          outputs: |
            assets/github-snake.svg?color_snake=#284D3D&color_dots=#EDF3EE,#DCEFE2,#B8D8BE,#91BC9C,#70A583
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore: update contribution snake"
            git push
          fi
